[project]
name = "deep-agent-template"
version = "0.1.0"
description = "Deep Agent template for LangSmith/LangGraph deployment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.4.11",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint==4.1.1",
    "langgraph-sdk==0.4.4",
    "langchain==1.4.2",
    "langchain-core==1.6.3",
    "langchain-anthropic==1.3.5",
    "langchain-openai==1.1.11",
    "openai==2.54.0",
    "tiktoken==0.14.0",
    "langsmith==0.8.18",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-name = "deep_agent"
source-include = ["langgraph.json", ".env.example", "Makefile"]
