name: Agent regression
on: [push, pull_request]
jobs:
  regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.26'
      - run: uv sync --frozen
      - run: uv run --frozen python tools/verify_release.py
