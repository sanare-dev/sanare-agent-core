name: Owner intake offline tests
on:
  pull_request:
    paths:
      - src/deep_agent/owner_intake.py
      - tools/test_owner_intake.py
      - tools/OWNER_INTAKE.md
      - .github/workflows/owner-intake.yml
jobs:
  owner-intake:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p test_owner_intake.py -v
