name: Inbox import offline tests
on:
  pull_request:
    paths:
      - tools/import_compactions.py
      - tools/test_import_compactions.py
      - tools/INBOX_IMPORT.md
      - .github/workflows/inbox-import.yml
jobs:
  inbox-import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p test_import_compactions.py -v
